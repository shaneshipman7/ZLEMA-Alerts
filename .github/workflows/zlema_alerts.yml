name: ZLEMA Multi-TF Alerts

on:
  schedule:
    - cron: '*/15 9-16 * * 1-5'   # Every 15 min during market hours (Mon-Fri)
  workflow_dispatch:              # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run ZLEMA Alerts (with explicit tickers)
        run: |
          python3 zlema_alerts.py --tickers "HUBC,ASTS,WULF,PIII,IXHL,TE,EOSE,GE,SES,TKO,XPO"
        # Change "zlema_alerts.py" to whatever your actual script filename is
